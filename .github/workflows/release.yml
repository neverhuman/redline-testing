name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Install just
        run: cargo install just --locked
      - name: Verify release tag
        run: |
          test "${GITHUB_REF_TYPE:-}" = "tag"
          test -n "${GITHUB_REF_NAME:-}"
          git describe --tags --exact-match >/dev/null
      - name: Test
        run: scripts/ci-local.sh pr-ci
      - name: Build package
        run: scripts/ci-local.sh release
      - name: Attest package
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45
        with:
          subject-path: |
            dist/redline-testing-*-linux-x86_64.tar.gz
            dist/redline-testing-*-linux-x86_64.tar.gz.sha256
            dist/release-manifest.json
      - name: Generate release notes
        run: |
          tag="${GITHUB_REF_NAME:-manual}"
          version="${tag#v}"
          # Extract the current release's CHANGELOG section
          # (everything between the [version] heading and the next ## heading)
          awk "/^## \[${version}\]/{found=1; next} found && /^## /{exit} found{print}" \
            CHANGELOG.md > /tmp/changelog-section.md
          # Write release notes without heredoc to avoid YAML-indentation bleed
          {
            printf '## redline-testing %s\n\n' "$tag"
            printf 'Conformance, benchmark, and SQLite-parity test harness for **any SQLite-compatible database**.\n'
            printf 'Point `--target-bin` at your binary; the runner does the rest.\n\n'
            printf '### Install\n\n'
            printf '```bash\n'
            printf 'curl -fsSL \\\n'
            printf '  https://github.com/%s/releases/download/%s/redline-testing-%s-linux-x86_64.tar.gz \\\n' \
              "$GITHUB_REPOSITORY" "$tag" "$version"
            printf '  | tar -xz\n'
            printf './redline-testing-%s-linux-x86_64/bin/redline-testing --version\n' "$version"
            printf '```\n\n'
            printf '### Verify attestation (Sigstore/SLSA)\n\n'
            printf '```bash\n'
            printf 'gh attestation verify redline-testing-%s-linux-x86_64.tar.gz \\\n' "$version"
            printf '  --repo %s\n' "$GITHUB_REPOSITORY"
            printf '```\n\n'
            printf 'Or verify the SHA-256 sidecar:\n\n'
            printf '```bash\n'
            printf 'sha256sum -c redline-testing-%s-linux-x86_64.tar.gz.sha256\n' "$version"
            printf '```\n\n'
            printf '### Quick start\n\n'
            printf '```bash\n'
            printf 'redline-testing run \\\n'
            printf '  --suite sqlite_parity \\\n'
            printf '  --target-bin /path/to/your-db \\\n'
            printf '  --sqlite-bin /usr/bin/sqlite3 \\\n'
            printf '  --output results.jsonl\n'
            printf '```\n\n'
            printf '### What'\''s in this release\n\n'
            cat /tmp/changelog-section.md
            printf '\n---\nFull changelog: [CHANGELOG.md](https://github.com/%s/blob/%s/CHANGELOG.md)\n' \
              "$GITHUB_REPOSITORY" "$tag"
          } > /tmp/release-notes.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME:-manual}"
          version="${tag#v}"
          # --verify-tag binds the release to a tag that already exists in
          # the repo, preventing accidental release creation against a
          # mutable / non-tag ref.
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "redline-testing ${tag}" \
            --notes-file /tmp/release-notes.md \
            --verify-tag \
            dist/redline-testing-*-linux-x86_64.tar.gz \
            dist/redline-testing-*-linux-x86_64.tar.gz.sha256 \
            dist/release-manifest.json
