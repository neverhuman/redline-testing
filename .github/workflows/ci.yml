name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Run local CI mirror
        run: scripts/ci-local.sh pr-ci

  # Jankurai-badge lane: extracts the numeric score from agent/repo-score.json,
  # updates the <!-- jankurai-score-badge:begin/end --> section in README.md,
  # and commits it back to main. Runs only on push to main so PRs from forks
  # never need contents:write. The [skip ci] annotation prevents a loop.
  jankurai-badge:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    needs: pr-ci
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Update jankurai score badge in README
        # agent/jankurai-badge.json is the tracked source of truth for the
        # jankurai score. When a developer updates the score (after re-running
        # jankurai), this step syncs the README badge to match. The badge JSON
        # format: .message = "38/100 advisory", .color = "red"|"orange"|etc.
        run: python3 scripts/update-badge.py
      - name: Commit badge update if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet README.md; then
            echo "Badge unchanged — nothing to commit"
          else
            git add README.md
            git commit -m "chore(badge): update jankurai score badge [skip ci]"
            git push
          fi

  # Beyond-postgres-reference lane: validates corpus/beyond_sqlite cases by
  # running each through psql ↔ psql self-compare. Gated to push/dispatch
  # (and the `exhaustive` branch) so PRs from forks don't have to provision
  # Postgres. The release workflow does NOT include this job — release
  # artifacts are produced from the no-Postgres fast lane only, preserving
  # the "sqlite_parity passes without Postgres" invariant.
  beyond-postgres:
    if: |
      github.event_name == 'push'
      || github.event_name == 'workflow_dispatch'
      || github.ref == 'refs/heads/exhaustive'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          # Bind to loopback only — the beyond-postgres CI job is internal;
          # publishing 5432 on 0.0.0.0 would let other workflow services
          # reach the test database.
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run beyond-SQLite oracle
        env:
          REDLINE_TESTING_POSTGRES_URL: postgresql://postgres@127.0.0.1:5432/postgres
        run: |
          cargo test --locked --test beyond_sqlite_smoke
          # The full `--suite beyond_sqlite` run sees Postgres via the env
          # var and exercises the oracle path. The legacy manifest-only path
          # continues to emit a feature record per features.json entry.
          cargo build --release --locked
          mkdir -p /tmp/redline-out
          ./target/release/redline-testing run \
            --suite beyond_sqlite \
            --target-bin sqlite3 \
            --output /tmp/redline-out/beyond.jsonl \
            --memory-samples
          echo "Beyond-SQLite oracle output (head):"
          head -50 /tmp/redline-out/beyond.jsonl
      - name: Upload beyond-SQLite raw output
        if: always()
        uses: actions/upload-artifact@5d5d22a31266ced268874388b861e4b58bb5c2f3
        with:
          name: beyond-sqlite-jsonl
          path: /tmp/redline-out/beyond.jsonl
          if-no-files-found: ignore
