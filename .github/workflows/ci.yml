name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Install just
        run: cargo install just --locked
      - name: Run local CI mirror
        run: scripts/ci-local.sh pr-ci

  # Jankurai-badge lane: regenerates agent/jankurai-badge.json from the
  # committed agent/repo-score.json and commits it back to main. Runs only on
  # push to main so PRs from forks never need contents:write. The [skip ci]
  # annotation on the auto-commit prevents a loop.
  jankurai-badge:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    needs: pr-ci
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Generate badge JSON from repo-score
        run: |
          level=$(jq -r '.observed_conformance_level' agent/repo-score.json)
          case "$level" in
            HL3) color=green ;;
            HL2) color=yellow ;;
            HL1) color=orange ;;
            *)   color=red ;;
          esac
          jq -n --arg msg "$level" --arg color "$color" \
            '{"schemaVersion":1,"label":"jankurai","message":$msg,"color":$color}' \
            > agent/jankurai-badge.json
      - uses: stefanzweifel/git-auto-commit-action@8621da0631e2c0497dd06699c43044d2a1b81eb2
        with:
          commit_message: "chore(badge): update jankurai score badge [skip ci]"
          file_pattern: agent/jankurai-badge.json

  # Beyond-postgres-reference lane: validates corpus/beyond_sqlite cases by
  # running each through psql ↔ psql self-compare. Gated to push/dispatch
  # (and the `exhaustive` branch) so PRs from forks don't have to provision
  # Postgres. The release workflow does NOT include this job — release
  # artifacts are produced from the no-Postgres fast lane only, preserving
  # the "sqlite_parity passes without Postgres" invariant.
  beyond-postgres:
    if: |
      github.event_name == 'push'
      || github.event_name == 'workflow_dispatch'
      || github.ref == 'refs/heads/exhaustive'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          # Bind to loopback only — the beyond-postgres CI job is internal;
          # publishing 5432 on 0.0.0.0 would let other workflow services
          # reach the test database.
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run beyond-SQLite oracle
        env:
          REDLINE_TESTING_POSTGRES_URL: postgresql://postgres@127.0.0.1:5432/postgres
        run: |
          cargo test --locked --test beyond_sqlite_smoke
          # The full `--suite beyond_sqlite` run sees Postgres via the env
          # var and exercises the oracle path. The legacy manifest-only path
          # continues to emit a feature record per features.json entry.
          cargo build --release --locked
          mkdir -p /tmp/redline-out
          ./target/release/redline-testing run \
            --suite beyond_sqlite \
            --target-bin sqlite3 \
            --output /tmp/redline-out/beyond.jsonl \
            --memory-samples
          echo "Beyond-SQLite oracle output (head):"
          head -50 /tmp/redline-out/beyond.jsonl
      - name: Upload beyond-SQLite raw output
        if: always()
        uses: actions/upload-artifact@5d5d22a31266ced268874388b861e4b58bb5c2f3
        with:
          name: beyond-sqlite-jsonl
          path: /tmp/redline-out/beyond.jsonl
          if-no-files-found: ignore
